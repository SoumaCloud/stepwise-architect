[package]
name = "stepwise-architect"
version = "0.2.0"
edition = "2024"
description = "Local Rust commands for the Stepwise Architect Claude Code skill"
license = "MIT"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "stepwise"
path = "rust/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
uuid = { version = "1.26.0", features = ["v4"] }
