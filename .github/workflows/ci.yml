name: Test free local core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.100.0 fmt --check
      - run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.100.0 test --locked
      - run: cargo +1.100.0 build --release --locked
      - run: ./skills/project-adviser/scripts/stepwise.sh demo
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
